name: Build and Release Binaries (Linux & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyinstaller pyside6-essentials

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyinstaller pyside6-essentials hidapi

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile \
            --name areyoulowbattery \
            --icon "assets/icon.png" \
            --add-data "profiles:profiles" \
            --add-data "rules:rules" \
            --add-data "assets:assets" \
            cli.py
          chmod +x dist/areyoulowbattery
          ./dist/areyoulowbattery --help
          cp dist/areyoulowbattery dist/areyoulowbattery-linux-x86_64

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name areyoulowbattery --icon "assets/icon.ico" --version-file windows_version_info.txt --add-data "profiles;profiles" --add-data "assets;assets" --hidden-import hid cli.py
          Copy-Item dist\areyoulowbattery.exe dist\areyoulowbattery-windows-x64.exe
          Compress-Archive -Path dist\areyoulowbattery.exe -DestinationPath dist\areyoulowbattery-windows-x64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Extract Patch Notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="[$TAG]" '
            index($0, "## " tag) == 1 { flag=1; print; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG" > release_notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release_assets/areyoulowbattery
            release_assets/areyoulowbattery-linux-x86_64
            release_assets/areyoulowbattery.exe
            release_assets/areyoulowbattery-windows-x64.exe
            release_assets/areyoulowbattery-windows-x64.zip
            rules/99-areyoulowbattery.rules
          generate_release_notes: true
