name: Build and Release Binaries (Linux & Windows)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1
          python -m pip install --upgrade pip
          pip install pyyaml pyinstaller pyside6-essentials

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyinstaller pyside6-essentials hidapi

      - name: Run automated unit tests
        run: python -m unittest discover -s tests -v

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile \
            --name areyoulowbattery \
            --icon "assets/icon.png" \
            --add-data "profiles:profiles" \
            --add-data "rules:rules" \
            --add-data "assets:assets" \
            cli.py
          chmod +x dist/areyoulowbattery
          ./dist/areyoulowbattery --help
          cp dist/areyoulowbattery dist/areyoulowbattery-linux-x86_64

      - name: Build executable and Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onedir --windowed --name areyoulowbattery --icon "assets/icon.ico" --version-file windows_version_info.txt --add-data "profiles;profiles" --add-data "assets;assets" --hidden-import hid cli.py
          Compress-Archive -Path dist\areyoulowbattery -DestinationPath dist\areyoulowbattery-windows-x64.zip
          iscc installer.iss
          Remove-Item -Recurse -Force dist\areyoulowbattery

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine Release Tag and Extract Patch Notes
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(python -c "import areyoulowbattery; print(areyoulowbattery.__version__)")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          awk -v tag="[$TAG]" '
            index($0, "## " tag) == 1 { flag=1; print; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG" > release_notes.md
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          body_path: release_notes.md
          files: |
            release_assets/areyoulowbattery
            release_assets/areyoulowbattery-linux-x86_64
            release_assets/AreYouLowBattery-Windows-Setup.exe
            release_assets/areyoulowbattery-windows-x64.zip
            rules/99-areyoulowbattery.rules
          generate_release_notes: false
