name: Build and Release Linux Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyinstaller pyside6-essentials

      - name: Build single-file executable
        run: |
          pyinstaller --onefile \
            --name areyoulowbattery \
            --add-data "profiles:profiles" \
            --add-data "rules:rules" \
            cli.py
          chmod +x dist/areyoulowbattery

      - name: Smoke test binary
        run: |
          ./dist/areyoulowbattery --help

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/areyoulowbattery
            rules/99-areyoulowbattery.rules
          generate_release_notes: true
